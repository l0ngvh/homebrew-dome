name: Update Cask

on:
  repository_dispatch:
    types: [new-nightly-release]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update cask
        env:
          VERSION:     ${{ github.event.client_payload.version }}
          SHA_AARCH64: ${{ github.event.client_payload.sha_aarch64_dmg }}
        run: |
          set -euo pipefail
          sed -i "s/^  version .*/  version \"$VERSION\"/" Casks/dome-nightly.rb
          sed -i "s/^  sha256 arm:.*/  sha256 arm:   \"$SHA_AARCH64\"/" Casks/dome-nightly.rb

      - name: Commit and push
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dome-nightly.rb
          git commit -m "chore: bump dome-nightly to $VERSION"
          git push
